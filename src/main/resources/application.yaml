# ===================================================================
# GENERAL PROPERTIES
# ===================================================================
server:
  port: 8080
  servlet:
    context-path: /archetype-service
spring:
  mail:
    default-encoding: UTF-8
    host: smtp.gmail.com
    port: 587
    username: DEC(your_username)
    password: DEC(your_password)
    server:
      protocol: smtp
      debug: true
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  freemarker:
    template-loader-path: classpath:/templates
    charset: UTF-8
    cache: false
  application:
    name: archetype-service
  main.banner-mode: off
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/archetypedb
    username: ENC(8gbqvhYTfYgLSMqysc2AQmvgiZEeMRtP7XNdNvALyI6Yrf2XtB0Oy6wtPYkI6BM2)
    password: ENC(G1S58A3F6ykIQtSqAVnETEzVNbK93XOHAkIUStbJRvZldzLilF5FHck9mrCpx2YK)
  jpa:
    naming-strategy: org.hibernate.cfg.ImprovedNamingStrategy
    hibernate.ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:/db/migration
    baseline-on-migrate: true
    baseline: 0

  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces

management:
  tracing:
    sampling:
      probability: 1.0
  endpoint:
    metrics:
      enabled: true
    prometheus:
      enabled: true
  endpoints:
    web:
      exposure:
        include: '*'
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  prometheus:
    metrics:
      export:
        enabled: true
# ===================================================================
