# ===================================================================
# LOG PROPERTIES
# ===================================================================
logging:
  pattern:
    file: '[%X{data}%thread] [%X{X-B3-TraceId:-}] - %5p'
    console: "%p [${spring.application.name:}, %d{'yyyy-MM-dd HH:mm:ss,SSS',America/Mexico_City}, %C{1}:%M:%L, %X{mdc.uuid}, %m%n%ex{3}"
  level:
    com.moontech: DEBUG
    org:
      springframework.data: DEBUG
      hibernate:
        SQL: DEBUG
        type.descriptor.sql.BasicBinder: TRACE

# ===================================================================
# URL ENDPOINTS
# ===================================================================
api:
  uri:
    domain:
      users: /users
    data:
      modified: /{id}
      authentication: ${api.uri.domain.users}/authentication
      confirm: ${api.uri.domain.users}/confirm
      userConfirm: /confirm
      reset: /password/reset
      passwordForgot: ${api.uri.domain.users}/password/reset
  interceptorPath: "/**"
  # ===================================================================
  # MAIL TEMPLATE PROPERTIES
  # ===================================================================
  mail:
    templates:
      user: email-user-template.flth
      customer: email-customer-template.flth
      payment: email-payment-subscription-template.flth
      forgot_password: forgot-password-template.flth
      reset_password: reset_password_template.flth
    from: DEC(your email)
    welcomeSubject: Bienvenido
    forgotPasswordSubject: Recupera tu Contraseña
    resetPasswordSubject: Tu contraseña ha sido cambiada
    enterpriseName: Enterprise-Name
    supportEmail: support@enterprise.com
# ===================================================================
# GEOIP PROPERTIES
# ===================================================================
geoip:
  db-path: classpath:geolocation/GeoLite2-City.mmdb

